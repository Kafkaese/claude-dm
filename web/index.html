<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude DM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400;1,7..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F1EA; --surface: #FBF9F4; --border: #E1DACB; --field-border: #D9D1C0;
  --text: #1F1D1A; --muted: #5F594F; --bubble: #E6E0D2; --accent: #A0552A; --accent-ink: #FFFFFF;
  --accent-soft: #F3DCCB; --accent-soft-ink: #7E3F1C; --pc: #2F5FB3; --ally: #2E7D4F; --enemy: #B23A32;
  --map-floor: #EDE4CF; --map-grid: #CFC3A8; --map-wall: #4A4640; --map-wall-edge: #36332F;
  --map-hatch: #B89B6E; --map-difficult: #DCCDAE; --map-water: #8DB4D6; --map-wave: #D2E3F1;
  --map-trees: #A9C79A; --map-tree: #5E8E52; --map-door: #8C5E32; --map-pit: #1B1A1E;
  --map-bridge: #C29A68; --map-plank: #8E6436; --map-hover: #A0552A;
  --serif: 'Literata', Georgia, serif; --sans: 'IBM Plex Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141317; --surface: #1C1B20; --border: #2C2A31; --field-border: #34323A;
    --text: #ECE7DF; --muted: #A9A296; --bubble: #26252B; --accent: #D9965F; --accent-ink: #141317;
    --accent-soft: #3A2A1E; --accent-soft-ink: #E8B283; --pc: #6D96E0; --ally: #4CAF78; --enemy: #D65A50;
    --map-floor: #CDBF9F; --map-grid: #AA9C7D; --map-wall: #2F2D2A; --map-wall-edge: #1F1E1C;
    --map-hatch: #957A4F; --map-difficult: #BDAC89; --map-water: #6F97BA; --map-wave: #A9C4DB;
    --map-trees: #8EAE7E; --map-tree: #4B7442; --map-door: #7A5028; --map-pit: #0E0E10;
    --map-bridge: #A8835A; --map-plank: #7A5530; --map-hover: #E8B283;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); display: flex; flex-direction: column; }
button { font: inherit; color: inherit; cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

header { height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand .title { font-family: var(--serif); font-size: 18px; font-weight: 600; white-space: nowrap; }
.badge { padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-soft-ink); font-size: 12.5px; font-weight: 600; }
.badge[hidden] { display: none; }
nav { display: flex; align-items: center; gap: 4px; }
.navbtn { height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: transparent; font-weight: 500; font-size: 14px; }
.navbtn:hover, .iconbtn:hover { background: var(--bubble); }
.iconbtn { width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center; }

.layout { flex: 1; display: flex; min-height: 0; }
main { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
#scroll { flex: 1; width: 100%; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
#chat { width: min(720px, calc(100% - 48px)); display: flex; flex-direction: column; gap: 26px; padding: 40px 0 24px; transition: width .25s; }
body.combat #chat, body.combat #composer { width: min(640px, calc(100% - 48px)); }

.dm { font-family: var(--serif); font-size: 19px; line-height: 1.65; overflow-wrap: anywhere; }
body.combat .dm { font-size: 18px; line-height: 1.6; }
.dm p { margin: 0 0 16px; } .dm p:last-child { margin-bottom: 0; }
.dm blockquote { margin: 0 0 16px; padding-left: 16px; border-left: 2px solid var(--border); font-style: italic; }
.dm ul, .dm ol { margin: 0 0 16px; padding-left: 24px; }
.dm h1, .dm h2, .dm h3 { font-size: 1.05em; margin: 0 0 10px; }
.dm code { font-family: var(--mono); font-size: .85em; }
.dm pre { font-family: var(--mono); font-size: 13px; line-height: 1.45; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
.dm table { border-collapse: collapse; font-family: var(--sans); font-size: 14px; margin: 0 0 16px; }
.dm th, .dm td { border-bottom: 1px solid var(--border); padding: 6px 12px 6px 0; text-align: left; }
.dm hr { border: 0; border-top: 1px solid var(--border); margin: 18px 0; }
.player { align-self: flex-end; max-width: 78%; padding: 12px 18px; border-radius: 16px 16px 4px 16px; background: var(--bubble); font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.system { color: var(--muted); font-size: 13.5px; font-style: italic; }
.debug { color: var(--muted); font: 12px/1.4 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.logcard { padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; gap: 4px; }
.logcard .head { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.logline { font: 12.5px/1.5 var(--mono); }
.logline .r { color: var(--muted); margin-right: 6px; }

#status { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
#status[hidden] { display: none; }
#status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { #status .dot { animation: none; } }

#composer { width: min(720px, calc(100% - 48px)); padding: 0 0 22px; display: flex; flex-direction: column; gap: 8px; transition: width .25s; }
.field { display: flex; align-items: flex-end; gap: 10px; padding: 10px 10px 10px 18px; background: var(--surface); border: 1px solid var(--field-border); border-radius: 16px; }
.field:focus-within { border-color: var(--accent); }
#msg { flex: 1; resize: none; border: 0; outline: none; background: transparent; color: var(--text); font: 400 16px/1.5 var(--sans); padding: 8px 0; max-height: 220px; }
#send { width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
#send:disabled { opacity: .45; cursor: default; }
.hints { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); font-size: 12.5px; }
.inputrow { display: flex; align-items: stretch; gap: 10px; }
.inputrow .field { flex: 1; min-width: 0; }
.turnbtn { flex-shrink: 0; min-width: 132px; max-width: 220px; min-height: 66px; padding: 0 18px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14.5px; border: 1px solid var(--field-border); background: var(--surface); color: var(--text); }
.turnbtn[hidden] { display: none; }
.turnbtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.turnbtn.end { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.turnbtn:not(:disabled):hover { filter: brightness(1.05); border-color: var(--accent); }
.turnbtn:disabled { opacity: .45; cursor: default; }
.combatrow { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
.combatrow[hidden] { display: none; }
.combatrow .auto { display: flex; align-items: center; gap: 8px; cursor: pointer; min-height: 32px; }
.combatrow input { width: 16px; height: 16px; accent-color: var(--accent); }
#awaiting { color: var(--accent-soft-ink); font-weight: 600; text-align: right; }
.signal { align-self: center; display: flex; align-items: center; gap: 12px; width: 100%; color: var(--muted); font-size: 12.5px; letter-spacing: .04em; }
.signal::before, .signal::after { content: ""; flex: 1; border-top: 1px solid var(--border); }

aside { width: 0; flex-shrink: 0; overflow: hidden; background: var(--surface); transition: width .25s; }
body.combat aside { width: var(--panel-w, 540px); }
body.resizing aside, body.resizing #chat, body.resizing #composer { transition: none; }
body.resizing { cursor: col-resize; user-select: none; }
.panel { width: 100%; min-width: 320px; height: 100%; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; }
#divider { display: none; width: 9px; margin: 0 -4px; flex-shrink: 0; position: relative; z-index: 2; cursor: col-resize; background: transparent; border: 0; padding: 0; touch-action: none; }
#divider::before { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; background: var(--border); transition: background .15s, width .15s, left .15s; }
#divider:hover::before, #divider:focus-visible::before, body.resizing #divider::before { background: var(--accent); width: 3px; left: 3px; }
#divider:focus-visible { outline: none; }
body.combat #divider { display: block; }
.panel .top { display: flex; align-items: baseline; justify-content: space-between; }
.panel .round { font-family: var(--serif); font-size: 18px; font-weight: 600; }
.panel .turn { color: var(--muted); font-size: 14px; }
#map { position: relative; width: 100%; }
#map svg { width: 100%; height: auto; display: block; user-select: none; }
#map .cell { cursor: pointer; }
#map .label { fill: var(--muted); font: 500 11px var(--mono); }
#map .tok-text { fill: #FFFFFF; font: 600 14px var(--sans); pointer-events: none; }
#tip { position: absolute; pointer-events: none; z-index: 3; max-width: 240px; padding: 8px 10px; border-radius: 8px; background: var(--text); color: var(--bg); font-size: 12.5px; line-height: 1.4; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
#tip[hidden] { display: none; }
#tip .t-name { font-weight: 600; }
#tip .t-hint { opacity: .7; font-size: 11.5px; margin-top: 2px; }
.section-label { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 6px; }
#init { display: flex; flex-direction: column; gap: 2px; }
.initrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 34px; grid-template-areas: "tok name status init" "tok cond cond cond"; align-items: center; column-gap: 12px; padding: 7px 10px; border-radius: 10px; font-size: 14px; }
.initrow.current { background: var(--accent-soft); }
.initrow.current .name { font-weight: 600; }
.initrow .tok { grid-area: tok; align-self: start; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font: 600 12px var(--sans); box-shadow: 0 0 0 1px var(--border); }
.initrow.current .tok { box-shadow: 0 0 0 3px #E0A21C; }
.initrow.fallen .tok { background: #8A8A8A !important; text-decoration: line-through; }
.initrow .name { grid-area: name; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.initrow .status { grid-area: status; color: var(--muted); white-space: nowrap; }
.initrow.current .status { color: inherit; }
.initrow .init { grid-area: init; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.initrow .cond { grid-area: cond; color: var(--accent-soft-ink); font-size: 12.5px; margin-top: 2px; }
.initrow.current .cond { color: var(--accent-soft-ink); }
.init-head { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 34px; column-gap: 12px; padding: 0 10px 4px; color: var(--muted); font-size: 11.5px; }
.init-head span:last-child { text-align: right; }
.rollchip { display: inline-block; font: 12.5px var(--sans); color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 10px; margin: 2px 0; font-style: normal; }
#legend { color: var(--muted); font-size: 12px; margin-top: -8px; display: flex; flex-direction: column; gap: 6px; }
#legend .keys { display: flex; flex-wrap: wrap; gap: 6px 14px; }
#legend .key { display: inline-flex; align-items: center; gap: 6px; color: var(--text); }
#legend .key svg { width: 18px; height: 18px; border-radius: 3px; box-shadow: 0 0 0 1px var(--border); flex: none; }
#log { display: flex; flex-direction: column; gap: 4px; }

.drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); border-left: 1px solid var(--border); padding: 24px 28px; overflow-y: auto; transform: translateX(100%); transition: transform .25s; }
body.drawer-open .drawer { transform: none; }
body.drawer-open .drawer-backdrop { display: block; }
.drawer .dhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.drawer .dhead h2 { font-family: var(--serif); font-size: 20px; margin: 0; }
.drawer .dm { font-size: 16px; line-height: 1.6; }

.menu { position: absolute; top: 60px; right: 20px; width: 260px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: none; flex-direction: column; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.12); z-index: 5; }
.menu.open { display: flex; }
.menu label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.menu .check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); }
.menu .check input { width: 16px; height: 16px; margin: 0; }
.menu hr { border: none; border-top: 1px solid var(--border); margin: 2px 0; width: 100%; }
.menu select, .menu button { height: 40px; border-radius: 8px; border: 1px solid var(--field-border); background: var(--bg); color: var(--text); padding: 0 10px; font-size: 14px; }

@media (max-width: 1100px) {
  body.combat .layout { flex-direction: column; }
  body.combat aside { width: 100%; max-height: 45vh; border-top: 1px solid var(--border); }
  body.combat #divider { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l8.5 5v10L12 22 3.5 17V7z"/><path d="M12 2v20M3.5 7L20.5 17M20.5 7L3.5 17"/></svg>
    <span class="title" id="title">Claude DM</span>
    <span class="badge" id="combat-badge" hidden>In combat</span>
  </div>
  <nav aria-label="Player tools">
    <button class="navbtn" type="button" data-doc="character">Character</button>
    <button class="navbtn" type="button" data-doc="party">Party notes</button>
    <button class="navbtn" type="button" data-doc="handouts">Handouts</button>
    <button class="iconbtn" type="button" id="settings-btn" aria-label="Settings" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
    </button>
  </nav>
  <div class="menu" id="menu" role="dialog" aria-label="Settings">
    <label>Campaign
      <select id="camp-select"></select>
    </label>
    <label class="check"><input type="checkbox" id="camp-end" checked> End the current session first</label>
    <button type="button" id="camp-switch" disabled>Switch campaign</button>
    <hr>
    <label>Thinking effort
      <select id="effort"><option>low</option><option>medium</option><option>high</option><option>xhigh</option><option>max</option></select>
    </label>
    <button type="button" id="debug-btn">Debug: off</button>
  </div>
</header>

<div class="layout">
  <main>
    <div id="scroll">
      <div id="chat" aria-live="polite"></div>
    </div>
    <form id="composer">
      <div id="status" hidden><span class="dot"></span><span id="status-text"></span></div>
      <div class="inputrow">
        <div class="field">
          <label class="sr-only" for="msg">Your message to the DM</label>
          <textarea id="msg" rows="1" placeholder="What do you do?"></textarea>
          <button id="send" type="submit" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--accent-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
        <button id="turn-btn" class="turnbtn" type="button" hidden><span id="turn-label">Next</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <div class="combatrow" id="combatrow" hidden>
        <label class="auto"><input type="checkbox" id="auto"> Auto-combat: play non-player turns one after another</label>
        <span id="awaiting"></span>
      </div>
      <div class="hints"><span>Enter to send · Shift+Enter for a new line</span><span>"quotes" = speech · [brackets] = talk to the system</span></div>
    </form>
  </main>
  <div id="divider" role="separator" aria-orientation="vertical" aria-label="Resize the battle map panel" tabindex="0" title="Drag to resize · double-click to reset"></div>
  <aside aria-label="Battle map">
    <div class="panel">
      <div class="top"><span class="round" id="round">Round 1</span><span class="turn" id="turn"></span></div>
      <div id="map"><div id="svgwrap"></div><div id="tip" hidden></div></div>
      <div id="legend"></div>
      <div><div class="section-label">Initiative</div><div class="init-head" aria-hidden="true"><span></span><span>Name</span><span>Health</span><span>Init</span></div><div id="init"></div></div>
      <div><div class="section-label">Combat log</div><div id="log"></div></div>
    </div>
  </aside>
</div>

<div class="drawer-backdrop" id="backdrop"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <div class="dhead"><h2 id="drawer-title">Character</h2><button class="iconbtn" type="button" id="drawer-close" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dm" id="drawer-body"></div>
</div>

<script>
// ---------- markdown (escape first, then a small subset) ----------
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  // roll markers: *(Rolled: Perception)* → a small chip (the DM rolled a check the player asked for)
  s = s.replace(/\*\(Rolled: ([^)]*(?:\([^)]*\))?[^)]*)\)\*/g, `<span class="rollchip" title="The DM rolled this check for you">🎲 $1</span>`);
  s = s.replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^\*\w])\*(?!\s)(.+?)(?<!\s)\*(?![\*\w])/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^_\w])_(?!\s)(.+?)(?<!\s)_(?![_\w])/g, "$1<em>$2</em>");
  return s;
}
function md(text) {
  const lines = text.split("\n"); const out = []; let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push("<pre>" + esc(buf.join("\n")) + "</pre>"); continue;
    }
    if (/^\s*$/.test(line)) { i++; continue; }
    if (/^#{1,6}\s/.test(line)) { out.push("<h3>" + inline(line.replace(/^#{1,6}\s/, "")) + "</h3>"); i++; continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
    if (/^\s*\|/.test(line)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) { if (!/^\s*\|?\s*:?-{3,}/.test(lines[i])) rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      out.push("<table>" + rows.map((r, n) => "<tr>" + cells(r).map(c => n ? `<td>${c}</td>` : `<th>${c}</th>`).join("") + "</tr>").join("") + "</table>");
      continue;
    }
    if (/^>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out.push("<blockquote>" + buf.map(inline).join("<br>") + "</blockquote>"); continue;
    }
    if (/^\s*([-*]|\d+\.)\s/.test(line)) {
      const ordered = /^\s*\d+\./.test(line); const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s/.test(lines[i])) items.push(inline(lines[i++].replace(/^\s*([-*]|\d+\.)\s/, "")));
      out.push((ordered ? "<ol>" : "<ul>") + items.map(x => `<li>${x}</li>`).join("") + (ordered ? "</ol>" : "</ul>")); continue;
    }
    const buf = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(\s*```|#{1,6}\s|>|\s*\||\s*([-*]|\d+\.)\s)/.test(lines[i])) buf.push(lines[i++]);
    out.push("<p>" + buf.map(inline).join("<br>") + "</p>");
  }
  return out.join("");
}

// ---------- chat ----------
const chat = document.getElementById("chat"), scroller = document.getElementById("scroll");
const msg = document.getElementById("msg"), sendBtn = document.getElementById("send");
let current = null, currentText = "", busy = false, statusSince = null, statusLabel = null;

function nearBottom() { return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120; }
function stick(fn) { const b = nearBottom(); fn(); if (b) scroller.scrollTop = scroller.scrollHeight; }
function add(cls, html) { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; stick(() => chat.appendChild(d)); return d; }
function addPlayer(text) {
  const t = text.trim().toLowerCase();
  const d = document.createElement("div");
  if (t === "next" || t === "end turn") {           // go signals render as quiet dividers
    d.className = "signal";
    d.textContent = t === "next" ? "next turn" : "end of your turn";
  } else {
    d.className = "player"; d.textContent = text;
  }
  stick(() => chat.appendChild(d));
}
function addLog(title, events) {
  if (!events || !events.length) return;
  add("logcard", `<div class="head">${esc(title)}</div>` + events.map(e => `<div class="logline"><span class="r">R${e.round ?? "?"}</span>${esc(e.text)}</div>`).join(""));
}
function renderItem(m) {
  if (m.role === "player") addPlayer(m.text);
  else if (m.role === "dm") add("dm", md(m.text));
  else if (m.role === "system") add("system", esc(m.text));
  else if (m.role === "debug") add("debug", esc(m.text));
  else if (m.role === "log") addLog(m.title, m.events);
}

function setBusy(b) { busy = b; sendBtn.disabled = b; updateTurnButton(); if (!b) maybeAuto(); }

// ---------- turn button & auto-combat ----------
const turnBtn = document.getElementById("turn-btn"), autoBox = document.getElementById("auto");
let combatState = { active: false }, autoTimer = null, lastAutoKey = null;
try { autoBox.checked = localStorage.getItem("dm-auto-combat") === "1"; } catch (e) {}
autoBox.addEventListener("change", () => {
  try { localStorage.setItem("dm-auto-combat", autoBox.checked ? "1" : "0"); } catch (e) {}
  lastAutoKey = null; maybeAuto();
});
function turnSignal() {
  const c = combatState;
  if (!c.active || c.awaiting) return null;
  // no visible actor is up (a hidden one the DM should have skipped): offer a neutral "Next turn"
  return c.turn_side === "pc" ? "end turn" : "next";
}
function updateTurnButton() {
  const c = combatState, sig = turnSignal();
  document.getElementById("combatrow").hidden = !c.active;
  document.getElementById("awaiting").textContent = c.active && c.awaiting ? `The DM is waiting for you: ${c.awaiting}` : "";
  turnBtn.hidden = !c.active;
  if (!c.active) return;
  const label = document.getElementById("turn-label");
  turnBtn.classList.toggle("end", sig === "end turn");
  const up = c.upcoming;   // who plays on the next signal (computed by the server, hidden ones skipped)
  if (c.awaiting) label.textContent = "Answer the DM";
  else if (sig === "end turn") label.textContent = "End turn";
  else label.textContent = up ? `Next: ${up.name}` : "Next turn";
  turnBtn.disabled = busy || !sig;
  turnBtn.setAttribute("aria-label", sig === "end turn" ? "End your turn" : (up ? `Play ${up.name}'s turn` : "Play the next turn"));
}
turnBtn.addEventListener("click", () => {
  const sig = turnSignal();
  if (!sig || busy) return;
  clearTimeout(autoTimer);
  send(sig);
});
function maybeAuto() {
  clearTimeout(autoTimer);
  if (!autoBox.checked || busy || turnSignal() !== "next") return;
  const key = `${combatState.round}:${combatState.turn_token}:${combatState.events ? combatState.events.length : 0}`;
  if (key === lastAutoKey) return;   // the turn didn't advance since the last auto signal: don't loop
  autoTimer = setTimeout(() => {
    if (!autoBox.checked || busy || turnSignal() !== "next") return;
    lastAutoKey = key;
    send("next");
  }, 1500);
}
function setStatus(label, since) {
  statusLabel = label; statusSince = label ? (since ? since * 1000 : Date.now()) : null;
  document.getElementById("status").hidden = !label; tickStatus();
}
function tickStatus() {
  if (!statusLabel) return;
  const s = Math.max(0, Math.floor((Date.now() - statusSince) / 1000));
  document.getElementById("status-text").textContent = `${statusLabel}… ${s}s`;
}
setInterval(tickStatus, 500);

// ---------- battle map (SVG, drawn from the player-safe grid) ----------
const CELL = 40, LAB = 22;
const TOKEN_COLOR = side => side === "pc" ? "#3A6CC8" : side === "ally" ? "#42945C" : "#BC3A34";
let mapData = null;
const coord = (x, y) => String.fromCharCode(65 + x) + (y + 1);

function terrainShape(ch, px, py) {
  const r = (fill, extra = "") => `<rect x="${px}" y="${py}" width="${CELL}" height="${CELL}" fill="${fill}" ${extra}/>`;
  switch (ch) {
    case "#": return r("var(--map-wall)", `stroke="var(--map-wall-edge)" stroke-width="1"`);
    case "_": return r("var(--map-pit)");
    case "^": return r("url(#p-hatch)");
    case "~": return r("url(#p-water)");
    case "T": return r("var(--map-trees)") +
      `<circle cx="${px + 13}" cy="${py + 14}" r="8" fill="var(--map-tree)"/><circle cx="${px + 27}" cy="${py + 24}" r="9" fill="var(--map-tree)"/><circle cx="${px + 13}" cy="${py + 30}" r="5" fill="var(--map-tree)"/>`;
    case "+": return r("var(--map-floor)") + `<rect x="${px + 6}" y="${py + CELL / 2 - 5}" width="${CELL - 12}" height="10" rx="2" fill="var(--map-door)"/>`;
    case "=": return r("url(#p-bridge)");
    default: return r("var(--map-floor)");
  }
}

function renderMap(m) {
  mapData = m;
  const W = LAB + m.w * CELL + 2, H = LAB + m.h * CELL + 2;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Battle map, ${m.w} by ${m.h} squares. The initiative list below has the same information.">`;
  s += `<defs>
    <pattern id="p-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="var(--map-difficult)"/><rect width="3" height="10" fill="var(--map-hatch)"/></pattern>
    <pattern id="p-water" width="20" height="12" patternUnits="userSpaceOnUse"><rect width="20" height="12" fill="var(--map-water)"/><path d="M0 8 q5 -5 10 0 t10 0" fill="none" stroke="var(--map-wave)" stroke-width="1.5"/></pattern>
    <pattern id="p-bridge" width="40" height="10" patternUnits="userSpaceOnUse"><rect width="40" height="10" fill="var(--map-bridge)"/><rect y="8" width="40" height="2" fill="var(--map-plank)"/></pattern>
  </defs>`;
  for (let x = 0; x < m.w; x++) s += `<text class="label" x="${LAB + x * CELL + CELL / 2}" y="${LAB - 7}" text-anchor="middle">${String.fromCharCode(65 + x)}</text>`;
  for (let y = 0; y < m.h; y++) s += `<text class="label" x="${LAB / 2}" y="${LAB + y * CELL + CELL / 2 + 4}" text-anchor="middle">${y + 1}</text>`;
  for (let y = 0; y < m.h; y++) {
    const row = m.grid[y] || "";
    for (let x = 0; x < m.w; x++) {
      const ch = row[x] || " ";
      if (ch === " ") continue;
      s += terrainShape(ch, LAB + x * CELL, LAB + y * CELL);
      if (ch !== "#" && ch !== "_") s += `<rect x="${LAB + x * CELL}" y="${LAB + y * CELL}" width="${CELL}" height="${CELL}" fill="none" stroke="var(--map-grid)" stroke-width="1"/>`;
    }
  }
  for (const t of m.tokens) {
    const span = t.size * CELL, cx = LAB + t.x * CELL + span / 2, cy = LAB + t.y * CELL + span / 2, rad = span / 2 - 6;
    if (t.current) s += `<circle cx="${cx}" cy="${cy}" r="${rad + 4}" fill="none" stroke="#E0A21C" stroke-width="4"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="${rad}" fill="${t.fallen ? "#8A8A8A" : TOKEN_COLOR(t.side)}" stroke="#FFFFFF" stroke-width="2.5"/>`;
    if (t.fallen) {
      const k = rad * 0.5;
      s += `<path d="M${cx - k} ${cy - k} L${cx + k} ${cy + k} M${cx - k} ${cy + k} L${cx + k} ${cy - k}" stroke="#3C3C3C" stroke-width="3.5" stroke-linecap="round"/>`;
    } else {
      s += `<text class="tok-text" x="${cx}" y="${cy + 5}" text-anchor="middle" style="font-size:${t.size > 1 ? 18 : 14}px">${esc(t.token)}</text>`;
    }
  }
  s += `<rect id="hover" width="${CELL}" height="${CELL}" fill="none" stroke="var(--map-hover)" stroke-width="2.5" rx="3" visibility="hidden" pointer-events="none"/>`;
  s += `</svg>`;
  document.getElementById("svgwrap").innerHTML = s;
}

// Legend: a swatch (drawn with the map's own shapes and patterns) per terrain type on the map.
function renderLegend(m) {
  const names = (m && m.terrain_names) || {};
  const used = new Set(((m && m.grid) || []).join(""));
  const keys = Object.keys(names).filter(ch => used.has(ch)).map(ch =>
    `<span class="key"><svg viewBox="0 0 ${CELL} ${CELL}" aria-hidden="true">${terrainShape(ch, 0, 0)}</svg>${esc(names[ch])}</span>`);
  document.getElementById("legend").innerHTML =
    (keys.length ? `<div class="keys" aria-label="Terrain">${keys.join("")}</div>` : "") +
    "<div>Hover for details, click a square or token to add it to your message.</div>";
}

function mapHit(evt) {
  if (!mapData) return null;
  const svg = document.querySelector("#svgwrap svg");
  if (!svg) return null;
  const box = svg.getBoundingClientRect();
  const W = LAB + mapData.w * CELL + 2;
  const k = W / box.width;
  const x = Math.floor(((evt.clientX - box.left) * k - LAB) / CELL);
  const y = Math.floor(((evt.clientY - box.top) * k - LAB) / CELL);
  if (x < 0 || y < 0 || x >= mapData.w || y >= mapData.h) return null;
  const tok = mapData.tokens.find(t => x >= t.x && x < t.x + t.size && y >= t.y && y < t.y + t.size);
  const ch = (mapData.grid[y] || "")[x] || " ";
  return { x, y, tok, terrain: (mapData.terrain_names || {})[ch] || (ch === " " ? "outside" : "floor"), box, k };
}

const mapEl = document.getElementById("map"), tip = document.getElementById("tip");
mapEl.addEventListener("mousemove", e => {
  const h = mapHit(e), hover = document.getElementById("hover");
  if (!h) { tip.hidden = true; if (hover) hover.setAttribute("visibility", "hidden"); return; }
  if (hover) {
    const t = h.tok, size = t ? t.size : 1, x = t ? t.x : h.x, y = t ? t.y : h.y;
    hover.setAttribute("x", LAB + x * CELL); hover.setAttribute("y", LAB + y * CELL);
    hover.setAttribute("width", size * CELL); hover.setAttribute("height", size * CELL);
    hover.setAttribute("visibility", "visible");
  }
  let html;
  if (h.tok) {
    const t = h.tok, cond = t.conditions && t.conditions.length ? `<div>${t.conditions.map(esc).join(" · ")}</div>` : "";
    html = `<div class="t-name">${esc(t.name)} (${esc(t.token)})</div><div>${esc(t.status)}</div>${cond}<div class="t-hint">${coord(t.x, t.y)} · click to insert ${esc(t.token)}</div>`;
  } else {
    html = `<div class="t-name">${coord(h.x, h.y)}</div><div>${esc(h.terrain)}</div><div class="t-hint">click to insert ${coord(h.x, h.y)}</div>`;
  }
  tip.innerHTML = html;
  tip.hidden = false;
  const mb = mapEl.getBoundingClientRect();
  let left = e.clientX - mb.left + 14, top = e.clientY - mb.top + 14;
  if (left + tip.offsetWidth > mb.width) left = e.clientX - mb.left - tip.offsetWidth - 10;
  tip.style.left = left + "px"; tip.style.top = top + "px";
});
mapEl.addEventListener("mouseleave", () => { tip.hidden = true; const hv = document.getElementById("hover"); if (hv) hv.setAttribute("visibility", "hidden"); });
mapEl.addEventListener("click", e => {
  const h = mapHit(e);
  if (!h) return;
  const text = h.tok ? h.tok.token : coord(h.x, h.y);
  const start = msg.selectionStart ?? msg.value.length, end = msg.selectionEnd ?? start;
  const before = msg.value.slice(0, start), after = msg.value.slice(end);
  const ins = (before && !/\s$/.test(before) ? " " : "") + text + (after && !/^\s/.test(after) ? " " : "");
  msg.value = before + ins + after;
  const pos = before.length + ins.length;
  msg.focus(); msg.setSelectionRange(pos, pos); autosize();
});

// ---------- combat panel ----------
function setCombat(c) {
  combatState = c && c.active ? c : { active: false };
  if (!combatState.active) lastAutoKey = null;
  updateTurnButton();
  const active = !!(c && c.active);
  document.body.classList.toggle("combat", active);
  document.getElementById("combat-badge").hidden = !active;
  if (!active) return;
  document.getElementById("round").textContent = `Round ${c.round}`;
  document.getElementById("turn").textContent = c.turn ? `${c.turn}’s turn` : "";
  if (c.map) renderMap(c.map);
  // token colors match the map image (fixed, not themed)
  const color = side => side === "pc" ? "#3A6CC8" : side === "ally" ? "#42945C" : "#BC3A34";
  const fmtInit = n => Number.isInteger(n) ? n : Number(n).toFixed(1).replace(/\.0$/, "");
  document.getElementById("init").innerHTML = c.initiative.map(r => {
    const cls = "initrow" + (r.current ? " current" : "") + (r.fallen ? " fallen" : "");
    const cond = r.conditions && r.conditions.length ? `<span class="cond">${r.conditions.map(esc).join(" · ")}</span>` : "";
    const label = `${r.name}${r.current ? ", current turn" : ""}: ${r.status}${cond ? ", " + r.conditions.join(", ") : ""}, initiative ${fmtInit(r.init)}`;
    return `<div class="${cls}" aria-label="${esc(label)}"><span class="tok" style="background:${color(r.side)}">${esc(r.token)}</span><span class="name">${esc(r.name)}</span><span class="status">${esc(r.status)}</span><span class="init">${fmtInit(r.init)}</span>${cond}</div>`;
  }).join("");
  renderLegend(c.map);
  const log = document.getElementById("log");
  log.innerHTML = c.events.map(e => `<div class="logline"><span class="r">R${e.round ?? "?"}</span>${esc(e.text)}</div>`).join("");
  log.lastElementChild && log.parentElement.parentElement.scrollTo({ top: 1e9 });
}

// ---------- resizable side panel ----------
const DEFAULT_PANEL = 540, MIN_PANEL = 320, MIN_CHAT = 480;
const divider = document.getElementById("divider");
function clampPanel(w) { return Math.round(Math.max(MIN_PANEL, Math.min(w, window.innerWidth - MIN_CHAT))); }
function setPanelWidth(w, save) {
  w = clampPanel(w);
  document.documentElement.style.setProperty("--panel-w", w + "px");
  divider.setAttribute("aria-valuenow", String(w));
  if (save) { try { localStorage.setItem("dm-panel-width", String(w)); } catch (e) {} }
}
function currentPanelWidth() {
  return parseInt(getComputedStyle(document.documentElement).getPropertyValue("--panel-w")) || DEFAULT_PANEL;
}
(function initPanelWidth() {
  let saved = null;
  try { saved = parseInt(localStorage.getItem("dm-panel-width")); } catch (e) {}
  setPanelWidth(saved || DEFAULT_PANEL, false);
})();
divider.addEventListener("pointerdown", e => {
  e.preventDefault();
  divider.setPointerCapture(e.pointerId);
  document.body.classList.add("resizing");
  const move = ev => setPanelWidth(window.innerWidth - ev.clientX, false);
  const up = () => {
    divider.removeEventListener("pointermove", move);
    divider.removeEventListener("pointerup", up);
    divider.removeEventListener("pointercancel", up);
    document.body.classList.remove("resizing");
    setPanelWidth(currentPanelWidth(), true);
  };
  divider.addEventListener("pointermove", move);
  divider.addEventListener("pointerup", up);
  divider.addEventListener("pointercancel", up);
});
divider.addEventListener("dblclick", () => setPanelWidth(DEFAULT_PANEL, true));
divider.addEventListener("keydown", e => {
  const step = e.shiftKey ? 80 : 20;
  if (e.key === "ArrowLeft") { setPanelWidth(currentPanelWidth() + step, true); e.preventDefault(); }
  if (e.key === "ArrowRight") { setPanelWidth(currentPanelWidth() - step, true); e.preventDefault(); }
  if (e.key === "Home") { setPanelWidth(DEFAULT_PANEL, true); e.preventDefault(); }
});
window.addEventListener("resize", () => setPanelWidth(currentPanelWidth(), false));

// ---------- events from the server ----------
function connect() {
  const es = new EventSource("/events");
  es.onmessage = e => handle(JSON.parse(e.data));
  es.onerror = () => { es.close(); setTimeout(connect, 1500); };
}
let currentCampaign = null;
function setTitle(title) {
  document.getElementById("title").textContent = title || "Claude DM";
  document.title = `${title || "Claude DM"} · Claude DM`;
}
function handle(ev) {
  switch (ev.type) {
    case "hello":
      chat.innerHTML = ""; current = null;
      setTitle(ev.title); currentCampaign = ev.campaign;
      ev.history.forEach(renderItem);
      if (!ev.history.length) add("system", "New session. Type <strong>/start-session &lt;campaign&gt;</strong> or <strong>/new-campaign</strong> to begin.");
      setBusy(ev.busy); setStatus(ev.status, ev.status_since); setCombat(ev.combat);
      setSettings(ev.effort, ev.debug);
      scroller.scrollTop = scroller.scrollHeight;
      break;
    case "player": addPlayer(ev.text); current = null; break;
    case "busy": setBusy(ev.busy); if (!ev.busy) { setStatus(null); current = null; } break;
    case "status": setStatus(ev.label, ev.since); break;
    case "text_start":
      if (ev.new || !current) { current = add("dm", ""); currentText = ""; }
      else currentText += "\n\n";
      break;
    case "text":
      if (!current) { current = add("dm", ""); currentText = ""; }
      currentText += ev.delta; stick(() => { current.innerHTML = md(currentText); });
      break;
    case "text_end": break;
    case "turn_end": if (!ev.solicited) current = null; break;
    case "system": add("system", esc(ev.text)); break;
    case "error": add("system", esc(ev.message)); break;
    case "debug": add("debug", esc(ev.line)); break;
    case "combat":
      if (!ev.active && ev.final_events) addLog("The fight is over", ev.final_events);
      setCombat(ev);
      break;
    case "settings": setSettings(ev.effort, ev.debug); break;
    case "campaign": setTitle(ev.title); currentCampaign = ev.campaign; break;
  }
}

// ---------- input ----------
async function send(text) {
  const r = await fetch("/send", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
  if (r.status === 409) add("system", "The DM is still busy. Your message wasn’t sent.");
  return r.ok;
}
document.getElementById("composer").addEventListener("submit", async e => {
  e.preventDefault();
  const text = msg.value.trim();
  if (!text || busy) return;
  clearTimeout(autoTimer);
  msg.value = ""; autosize();
  if (!(await send(text)) && !text.startsWith(":")) msg.value = text;
});
msg.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); document.getElementById("composer").requestSubmit(); }
});
function autosize() { msg.style.height = "auto"; msg.style.height = Math.min(msg.scrollHeight, 220) + "px"; }
msg.addEventListener("input", autosize);

// ---------- drawer & settings ----------
document.querySelectorAll("[data-doc]").forEach(b => b.addEventListener("click", async () => {
  const r = await fetch(`/doc?name=${b.dataset.doc}`);
  const doc = r.ok ? await r.json() : { title: b.textContent, markdown: "*Nothing here yet.*" };
  document.getElementById("drawer-title").textContent = doc.title;
  document.getElementById("drawer-body").innerHTML = md(doc.markdown);
  document.body.classList.add("drawer-open");
  document.getElementById("drawer-close").focus();
}));
function closeDrawer() { document.body.classList.remove("drawer-open"); msg.focus(); }
document.getElementById("drawer-close").addEventListener("click", closeDrawer);
document.getElementById("backdrop").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeDrawer(); toggleMenu(false); } });

const menu = document.getElementById("menu"), settingsBtn = document.getElementById("settings-btn");
function toggleMenu(open) { menu.classList.toggle("open", open); settingsBtn.setAttribute("aria-expanded", String(open)); }
settingsBtn.addEventListener("click", () => {
  const open = !menu.classList.contains("open");
  toggleMenu(open);
  if (open) loadCampaigns();
});

// ---------- campaign switching ----------
const campSelect = document.getElementById("camp-select"), campSwitch = document.getElementById("camp-switch");
async function loadCampaigns() {
  const r = await fetch("/campaigns");
  if (!r.ok) return;
  const data = await r.json();
  campSelect.innerHTML = data.campaigns.map(c =>
    `<option value="${esc(c.slug)}"${c.slug === data.current ? " selected" : ""}>${esc(c.title)}</option>`).join("");
  currentCampaign = data.current;
  updateSwitch();
}
function updateSwitch() { campSwitch.disabled = busy || !campSelect.value || campSelect.value === currentCampaign; }
campSelect.addEventListener("change", updateSwitch);
campSwitch.addEventListener("click", async () => {
  const target = campSelect.options[campSelect.selectedIndex].text;
  const endFirst = document.getElementById("camp-end").checked;
  if (!confirm(`Switch to ${target}?` + (endFirst ? " The DM wraps up the current session first (this can take a few minutes)." : " The current session is not ended."))) return;
  toggleMenu(false);
  const r = await fetch("/switch", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ campaign: campSelect.value, end_current: endFirst }) });
  if (r.status === 409) add("system", "The DM is still busy. Try switching again when the reply is done.");
});
function setSettings(effort, debug) {
  if (effort) document.getElementById("effort").value = effort;
  document.getElementById("debug-btn").textContent = `Debug: ${debug ? "on" : "off"}`;
}
document.getElementById("effort").addEventListener("change", e => { send(`:effort ${e.target.value}`); toggleMenu(false); });
document.getElementById("debug-btn").addEventListener("click", () => { send(":debug"); toggleMenu(false); });

connect();
msg.focus();
</script>
</body>
</html>
